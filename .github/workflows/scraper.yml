name: Salesforce Corolla Scraper

on:
  schedule:
    # Runs every 6 hours aligned to Pacific Time:
    # - 18:00 (6:00 PM PDT) -> 01:00 UTC
    # - 00:00 (12:00 AM PDT) -> 07:00 UTC
    # - 06:00 (6:00 AM PDT) -> 13:00 UTC
    # - 12:00 (12:00 PM PDT) -> 19:00 UTC
    - cron: '0 1,7,13,19 * * *'
  # Allows manual triggers directly from the Actions tab anytime
  workflow_dispatch:

jobs:
  scrape-and-upsert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Car Extraction Script
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
        run: node grabCar.js
