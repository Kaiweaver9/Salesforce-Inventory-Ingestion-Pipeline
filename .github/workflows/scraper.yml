name: Salesforce Corolla Scraper

on:
  schedule:
    # Runs 7 minutes BEFORE the hour (aligned to Pacific Time):
    # - 17:53 (5:53 PM PDT) -> 00:53 UTC
    # - 23:53 (11:53 PM PDT) -> 06:53 UTC
    # - 05:53 (5:53 AM PDT) -> 12:53 UTC
    # - 11:53 (11:53 AM PDT) -> 18:53 UTC
    - cron: '53 0,6,12,18 * * *'
  # Allows manual triggers directly from the Actions tab anytime
  workflow_dispatch:

jobs:
  scrape-and-upsert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Car Extraction Script
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
        run: node grabCar.js
